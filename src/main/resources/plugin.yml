name: FakeItemChecker-Reloaded
version: '${version}'
main: com.layue13.fakeitemcheckerreloaded.FakeItemCheckerPlugin
authors: [ 'Layue13','wshycaa' ]
description: A modern fake item checker plugin for Minecraft servers
website: https://github.com/layue13/FakeItemChecker-Reloaded

commands:
  fic:
    usage: /fic [reload|add|list|remove|info]
    description: Main command for FakeItemChecker-Reloaded
    permission: fic.admin

permissions:
  fic.admin:
    description: Allows access to all FakeItemChecker commands
    default: op
  fic.default:
    description: Basic permission for FakeItemChecker
    default: op

softdepend:
  - PlayerDataSQL